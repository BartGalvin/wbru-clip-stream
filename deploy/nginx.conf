# Serve WBRU browser pages and clips, and proxy API requests to Node.
# install-runtime-config.mjs fills the deployment paths.
server {
    listen 80;
    server_name _; # Replace after DNS setup.

    # Serve the stream at root and expose extensionless operator routes.
    root "{{WBRU_APP_DIR}}/dist";
    index stream.html;

    location = / {
        try_files /stream.html =404;
    }
    location = /stream {
        return 302 /stream.html$is_args$args;
    }
    location = /tag {
        return 302 /tag.html$is_args$args;
    }
    location = /builder {
        return 302 /builder.html$is_args$args;
    }
    location = /playout {
        return 302 /playout.html$is_args$args;
    }
    location / {
        try_files $uri =404;
    }

    # Restrict catalog editing and playout history to operator credentials.
    # bootstrap.sh creates the password file during initial setup.
    location = /tag.html {
        auth_basic "WBRU operators";
        auth_basic_user_file /etc/nginx/wbru-htpasswd;
    }
    location = /builder.html {
        auth_basic "WBRU operators";
        auth_basic_user_file /etc/nginx/wbru-htpasswd;
    }
    location = /playout.html {
        auth_basic "WBRU operators";
        auth_basic_user_file /etc/nginx/wbru-htpasswd;
    }
    location ~* ^/api/tags(?:/|$) {
        auth_basic "WBRU operators";
        auth_basic_user_file /etc/nginx/wbru-htpasswd;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hide sidecars and hidden paths, then serve media with byte-range support.
    location ~ ^/clips/(?:[^/]+/)*\. {
        return 404;
    }
    location ~ ^/clips/.*\.info\.json$ {
        return 404;
    }
    location /clips/ {
        alias "{{WBRU_CLIPS_DIR}}/";
        add_header Cache-Control "public, max-age=3600";
    }

    # Public program API; the authenticated /api/tags block above takes precedence.
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
